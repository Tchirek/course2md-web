<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程库 · course2md</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="library.css">
</head>
<body class="c2md-scope">
  <header class="library-head"><a href="library.html">course2md · 课程库</a><button id="settings" class="c2md-button" type="button">设置</button></header>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="library-layout">
    <aside class="library-sidebar" aria-label="课程库与目录">
      <div id="helper-setup" hidden><p>安装本机助手后，课程库会自动连接。</p><a class="c2md-button" href="options.html#block-helper">安装本机助手</a><button id="helper-retry" class="c2md-button" type="button">检查连接</button></div>
      <label for="libraries">课程库</label>
      <select id="libraries"><option value="">选择课程库</option></select>
      <details id="connection"><summary>连接课程库</summary>
        <form id="connect"><label for="root">课程库的绝对路径</label><input id="root" required placeholder="例如 D:\Courses"><button class="c2md-button" type="submit">连接</button></form>
        <p class="c2md-meta">自动连接已有课程库；首次使用时准备默认保存位置。其他位置也可以在这里连接。</p>
      </details>
      <details><summary>course2md CLI</summary><p id="engine-status" class="c2md-meta"></p><button id="engine-install" class="c2md-button" type="button" hidden>安装 CLI</button><form id="engine-connect"><label for="engine-path">其他 CLI 位置（可选）</label><input id="engine-path" required placeholder="例如 D:\Tools\course2md.exe"><button class="c2md-button" type="submit">连接</button></form></details>
      <div class="library-filter"><label for="filter">查找课程</label><input id="filter" type="search" placeholder="课程名称或文件夹"><button id="refresh" class="c2md-button" type="button">刷新</button></div>
      <nav id="courses" aria-label="课程列表"></nav>
      <nav id="toc" aria-label="本课目录"></nav>
    </aside>
    <main id="reader" tabindex="-1">
      <div id="empty"><h1>阅读课程笔记</h1><p>连接课程库后，在左侧选择课程。网页生成的笔记可通过面板底部的「存入课程库」保存。</p></div>
      <article id="article" hidden>
        <header><h1 id="title"></h1><p id="meta" class="reader-meta"></p><a id="source" target="_blank" rel="noopener">打开来源视频</a></header>
        <div class="reader-controls">
          <label>版本 <select id="versions"></select></label>
          <label><input id="timestamps" type="checkbox" checked> 时间戳</label>
          <label><input id="images" type="checkbox" checked> 图片</label>
          <label><input id="original" type="checkbox"> 原文</label>
          <button id="download" class="c2md-button" type="button">下载文字 .md</button>
          <label>导出格式 <select id="export-format"><option value="md">Markdown（ZIP）</option><option value="html">HTML</option><option value="json">JSON（图片索引）</option></select></label>
          <button id="native-export" class="c2md-button" type="button" disabled>导出图文</button>
        </div>
        <form id="find" class="reader-search"><label for="query">查找正文</label><input id="query" type="search"><button class="c2md-button" type="submit">下一个</button><span id="matches" role="status"></span></form>
        <div id="summary"></div>
        <div id="body"></div>
      </article>
    </main>
  </div>
  <script type="module" src="library.js"></script>
</body>
</html>
