<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>course2md 设置</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="c2md-scope">
    <div class="page">
      <header class="page-head">
        <h1>course2md 设置</h1>
      </header>

      <section class="block" id="block-helper">
        <h2>本机助手</h2>
        <p class="c2md-meta">连接课程库、截图和本机模型。首次使用时运行安装器，依赖与连接会自动准备。</p>
        <div class="block-actions"><a id="helper-install" class="c2md-button">安装本机助手</a><button id="helper-check" class="c2md-button" type="button">检查连接</button><span id="helper-result" class="c2md-meta" role="status"></span></div>
      </section>

      <!-- 文字来源与显示：与弹窗里那几处勾选是同一份设置 -->
      <section class="block" id="block-display">
        <h2>显示</h2>
        <div class="rows" id="display-rows"></div>
      </section>

      <section class="block" id="block-subtitle">
        <h2>平台字幕</h2>
        <div class="rows">
          <div class="row">
            <label for="sub-lang">
              首选语言
              <span class="c2md-meta">如 zh-Hans、en；留空自动选择</span>
            </label>
            <input id="sub-lang" type="text" placeholder="跟随页面" spellcheck="false" />
          </div>
          <div class="row">
            <label for="sub-auto">
              没有人工字幕时使用自动生成字幕
            </label>
            <input id="sub-auto" type="checkbox" />
          </div>
        </div>
      </section>

      <section class="block" id="block-asr">
        <h2>本地模型转录</h2>
        <div class="rows">
          <div class="row">
            <label for="asr-endpoint">
              服务地址
              <span class="c2md-meta">内置 8081 · whisper.cpp 8080</span>
            </label>
            <input id="asr-endpoint" type="text" spellcheck="false" />
          </div>

          <div class="row">
            <label for="asr-key">
              API key
            </label>
            <input id="asr-key" type="password" spellcheck="false" autocomplete="off" />
          </div>

          <div class="row">
            <label for="asr-model">
              模型名
            </label>
            <input id="asr-model" type="text" spellcheck="false" />
          </div>

          <div class="row">
            <label for="asr-language">
              语言提示
            </label>
            <input id="asr-language" type="text" placeholder="自动" spellcheck="false" />
          </div>

          <div class="row">
            <label for="asr-chunk">
              切片长度（秒）
              <span class="c2md-meta">默认 30</span>
            </label>
            <input id="asr-chunk" type="number" min="5" max="120" step="5" />
          </div>

          <div class="row">
            <label for="asr-rate">
              录制倍率
              <span class="c2md-meta">仅录音时有效</span>
            </label>
            <input id="asr-rate" type="number" min="1" max="16" step="1" />
          </div>
        </div>

        <div class="block-actions">
          <button type="button" class="c2md-button" id="asr-start">启动本机转录服务</button>
          <button type="button" class="c2md-button" id="asr-grant">授权访问此地址</button>
          <button type="button" class="c2md-button" id="asr-test">测试连接</button>
          <span class="c2md-meta" id="asr-result"></span>
        </div>
      </section>

      <section class="block" id="block-llm">
        <h2>润色</h2>
        <div class="rows">
          <div class="row"><span class="row-label">润色方式</span><div id="llm-engine"></div></div>
        </div>
        <div class="block-actions"><button type="button" class="c2md-button" id="llm-local-start">启用本机润色</button><span class="c2md-meta" id="llm-local-result"></span></div>

        <div class="rows">
          <div class="row">
            <label for="llm-url">
              服务地址
              <span class="c2md-meta">OpenAI 兼容地址，止于 /v1</span>
            </label>
            <input id="llm-url" type="text" spellcheck="false" />
          </div>

          <div class="row">
            <label for="llm-key">
              API key
            </label>
            <input id="llm-key" type="password" spellcheck="false" autocomplete="off" />
          </div>

          <div class="row">
            <label for="llm-model">
              模型名
            </label>
            <input id="llm-model" type="text" spellcheck="false" />
          </div>

          <div class="row">
            <label for="llm-concurrency">
              并发块数
            </label>
            <input id="llm-concurrency" type="number" min="1" max="16" step="1" />
          </div>

          <div class="row">
            <label for="llm-glossary">
              术语表
            </label>
            <textarea id="llm-glossary" rows="4" spellcheck="false" placeholder="Transformer&#10;混合专家（MoE）"></textarea>
          </div>

          <div class="row">
            <label for="llm-instruction">
              自定义校对指令
            </label>
            <textarea id="llm-instruction" rows="6" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="block-actions">
          <button type="button" class="c2md-button" id="llm-grant">授权访问此地址</button>
          <button type="button" class="c2md-button" id="llm-test">测试连接</button>
          <span class="c2md-meta" id="llm-result"></span>
        </div>
      </section>

      <section class="block" id="block-appearance">
        <h2>外观</h2>
        <div class="rows">
          <div class="row">
            <span class="row-label">主题</span>
            <div id="theme-control"></div>
          </div>
        </div>
      </section>

      <section class="block block--quiet">
        <h2>重置</h2>
        <div class="block-actions">
          <button type="button" class="c2md-button" id="reset">恢复默认设置并清空密钥</button>
          <span class="c2md-meta" id="reset-result"></span>
        </div>
      </section>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
