<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="course2md: video to illustrated Markdown notes">
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', 'Yu Gothic UI', sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 2 10; animation: flow 1.1s linear infinite; }
    .line { transform-box: fill-box; transform-origin: left center; animation: write 7s ease-out infinite; }
    .d1 { animation-delay: .2s } .d2 { animation-delay: .6s } .d3 { animation-delay: 1s } .d4 { animation-delay: 1.4s }
    .d5 { animation-delay: 1.8s } .d6 { animation-delay: 2.2s } .d7 { animation-delay: 2.6s } .d8 { animation-delay: 3s }
    .head { transform-box: fill-box; transform-origin: center; animation: sweep 7s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes write { 0% { transform: scaleX(0); opacity: 0; } 8% { opacity: 1; } 22%, 88% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(236px); } }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .flow, .line, .head, .pulse { animation: none; } }
  </style>
  <rect width="1280" height="400" rx="24" fill="#f6f7fb"/>

  <!-- 名前と三語の一言 -->
  <g transform="translate(72 0)">
    <g transform="translate(0 96)">
      <rect width="56" height="56" rx="14" fill="#1d1f24" stroke="#dfe1e8"/>
      <path d="M21 13 L41 26 L21 39 Z" fill="#f5f5f2"/>
      <rect x="15" y="43" width="26" height="3.5" rx="1.75" fill="#246a50"/>
    </g>
    <text x="74" y="140" class="sans" font-size="50" font-weight="700" fill="#14151a" letter-spacing="-1">course<tspan fill="#246a50">2</tspan>md</text>
    <text y="200" class="sans" font-size="22" fill="#14151a">视频 → 图文讲义</text>
    <text y="234" class="sans" font-size="22" fill="#53555d">Lecture videos → illustrated notes</text>
    <text y="268" class="sans" font-size="22" fill="#53555d">講義動画 → 図入りノート</text>
    <g transform="translate(0 306)" class="sans" font-size="15">
      <rect width="118" height="30" rx="15" fill="#dde7e0"/><text x="59" y="20" text-anchor="middle" fill="#246a50">YouTube</text>
      <rect x="128" width="118" height="30" rx="15" fill="#dde7e0"/><text x="187" y="20" text-anchor="middle" fill="#246a50">bilibili</text>
      <rect x="256" width="118" height="30" rx="15" fill="#dde7e0"/><text x="315" y="20" text-anchor="middle" fill="#246a50">&lt;video&gt;</text>
    </g>
  </g>

  <!-- 動画：課件の画面と再生位置 -->
  <g transform="translate(560 88)">
    <rect width="300" height="200" rx="14" fill="#1d1f24" stroke="#dfe1e8"/>
    <rect x="22" y="18" width="256" height="144" rx="4" fill="#f3f3ef"/>
    <rect x="40" y="36" width="120" height="12" rx="3" fill="#2a2c33"/>
    <rect x="40" y="62" width="4" height="4" fill="#2a2c33"/><rect x="52" y="60" width="150" height="8" rx="2" fill="#2a2c33" opacity=".55"/>
    <rect x="40" y="80" width="4" height="4" fill="#2a2c33"/><rect x="52" y="78" width="176" height="8" rx="2" fill="#2a2c33" opacity=".55"/>
    <rect x="40" y="98" width="4" height="4" fill="#2a2c33"/><rect x="52" y="96" width="120" height="8" rx="2" fill="#b3261e" opacity=".8"/>
    <rect x="40" y="116" width="4" height="4" fill="#2a2c33"/><rect x="52" y="114" width="162" height="8" rx="2" fill="#2a2c33" opacity=".55"/>
    <rect x="32" y="178" width="236" height="4" rx="2" fill="#ffffff" opacity=".22"/>
    <g class="head"><rect x="32" y="178" width="2" height="4" fill="#246a50"/><circle cx="33" cy="180" r="6" fill="#246a50"/></g>
    <text y="228" class="sans" font-size="17" font-weight="600" fill="#14151a">1. What is Computation? <tspan fill="#246a50" class="pulse">↗</tspan></text>
  </g>

  <!-- 流れ -->
  <path d="M872 188 C 900 188, 902 188, 930 188" fill="none" stroke="#246a50" stroke-width="4" stroke-linecap="round" class="flow"/>
  <path d="M926 180 L938 188 L926 196" fill="none" stroke="#246a50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 出来上がる course.md -->
  <g transform="translate(954 40)">
    <rect width="258" height="320" rx="14" fill="#ffffff" stroke="#dfe1e8"/>
    <text x="18" y="30" class="mono" font-size="13" fill="#9a9ca5">course.md</text>
    <rect x="18" y="42" width="222" height="1" fill="#dfe1e8"/>
    <rect x="18" y="58" width="150" height="13" rx="3" fill="#14151a" class="line d1"/>
    <g class="line d2"><rect x="18" y="84" width="46" height="14" rx="7" fill="#dde7e0"/><text x="41" y="95" text-anchor="middle" class="mono" font-size="10" fill="#246a50">00:31</text><rect x="70" y="87" width="170" height="8" rx="2" fill="#9a9ca5" opacity=".6"/></g>
    <rect x="18" y="104" width="206" height="8" rx="2" fill="#9a9ca5" opacity=".6" class="line d3"/>
    <g class="line d4"><rect x="18" y="124" width="222" height="96" rx="6" fill="#1d1f24"/><rect x="30" y="134" width="198" height="76" rx="3" fill="#f3f3ef"/><rect x="42" y="146" width="90" height="8" rx="2" fill="#2a2c33"/><rect x="42" y="164" width="130" height="6" rx="2" fill="#2a2c33" opacity=".5"/><rect x="42" y="178" width="104" height="6" rx="2" fill="#2a2c33" opacity=".5"/><rect x="42" y="192" width="118" height="6" rx="2" fill="#b3261e" opacity=".7"/></g>
    <g class="line d5"><rect x="18" y="232" width="46" height="14" rx="7" fill="#dde7e0"/><text x="41" y="243" text-anchor="middle" class="mono" font-size="10" fill="#246a50">01:00</text><rect x="70" y="235" width="150" height="8" rx="2" fill="#9a9ca5" opacity=".6"/></g>
    <rect x="18" y="252" width="222" height="8" rx="2" fill="#9a9ca5" opacity=".6" class="line d6"/>
    <rect x="18" y="268" width="180" height="8" rx="2" fill="#9a9ca5" opacity=".6" class="line d7"/>
    <g class="line d8"><rect x="18" y="288" width="46" height="14" rx="7" fill="#dde7e0"/><text x="41" y="299" text-anchor="middle" class="mono" font-size="10" fill="#246a50">01:25</text><rect x="70" y="291" width="120" height="8" rx="2" fill="#9a9ca5" opacity=".6"/></g>
  </g>
</svg>
