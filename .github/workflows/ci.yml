name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Python syntax
        run: python -m py_compile tools/*.py
      # pack runs the full check first (manifest, typecheck, unit tests, layout assertions)
      # and refuses to build the zips if anything fails, so this is both the gate and a pack smoke test.
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
